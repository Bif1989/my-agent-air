name: Production Smoke

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "data/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for production app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            code="$(curl --silent --show-error --location --output /tmp/home.html --write-out '%{http_code}' --max-time 15 https://agent.bifavia.uz/ || true)"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]] && grep -Eqi "MY AGENT AIR|My Agent Air" /tmp/home.html; then
              echo "Production app is reachable with HTTP $code"
              exit 0
            fi
            echo "Attempt $attempt: production app not ready yet; waiting for Vercel deployment..."
            sleep 15
          done
          echo "Production app did not become ready in time"
          exit 1

      - name: Check critical public routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /login /register /manifest.webmanifest; do
            echo "Checking $path"
            curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 "https://agent.bifavia.uz${path}" --output /tmp/response
            test -s /tmp/response
          done
      - name: Check authentication guards without sending emails
        run: node .github/scripts/auth-production-smoke.cjs
