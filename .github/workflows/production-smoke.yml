name: Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production alias
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            code="$(curl --silent --show-error --location --output /tmp/home.html --write-out '%{http_code}' --max-time 15 https://agent.bifavia.uz/ || true)"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then
              echo "Production reachable with HTTP $code"
              exit 0
            fi
            echo "Attempt $attempt: HTTP ${code:-network-error}; waiting for Vercel deployment..."
            sleep 15
          done
          echo "Production did not become reachable in time"
          exit 1

      - name: Check critical public routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /login /register /manifest.webmanifest; do
            echo "Checking $path"
            curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 "https://agent.bifavia.uz${path}" --output /tmp/response
            test -s /tmp/response
          done

      - name: Check production brand
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20 https://agent.bifavia.uz/ | grep -qi "MY AGENT AIR"
