name: Disposable RFQ database smoke
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/disposable-rfq.yml", "tests/isolated-rfq/**"]
permissions:
  contents: read
jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/disposable-supabase-rfq'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$RUNNER_TEMP/maa-rfq"
          mkdir -p "$sandbox"
          cd "$sandbox"
          npx --yes supabase@2.90.0 init
          npx --yes supabase@2.90.0 start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/maa-rfq-start.log" 2>&1 || {
            echo "::error::Disposable Supabase start failed"
            grep -Ei 'error|fail|denied|not found|unhealthy' "$RUNNER_TEMP/maa-rfq-start.log" | tail -15 | cut -c1-250 || true
            exit 1
          }
          curl -fsS --max-time 15 http://127.0.0.1:54321/auth/v1/health >/dev/null
      - name: Replay schema on local database and reload the local Data API
        shell: bash
        run: |
          set -euo pipefail
          db=supabase_db_maa-rfq
          docker inspect "$db" >/dev/null
          apply() {
            echo "Applying $(basename "$1")"
            docker exec -i "$db" psql -X -U postgres -d postgres -q -v ON_ERROR_STOP=1 < "$1" >/dev/null
          }
          apply supabase/schema/baseline-before-resume.sql
          for file in supabase/migrations/*.sql; do
            [[ "$(basename "$file")" < "20261004113047_resume_security.sql" ]] && continue
            apply "$file"
          done
          docker exec "$db" psql -X -U postgres -d postgres -q -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: Install local web and browser test dependencies
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/maa-browser" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/maa-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify local Auth, RFQ APIs and real browser pages
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/maa-rfq"
          npx --yes supabase@2.90.0 status -o json > "$RUNNER_TEMP/maa-rfq-status.json" 2>/dev/null
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/maa-rfq-status.json', 'utf8'));
          async function test() {
            const base = new URL(config.API_URL);
            assert.equal(base.protocol, 'http:');
            assert.ok(['localhost', '127.0.0.1'].includes(base.hostname) && base.port === '54321', 'non-local Supabase blocked');
            assert.ok(config.SERVICE_ROLE_KEY && config.ANON_KEY, 'expected local Auth keys');
            async function call(path, key, token, body) {
              const res = await fetch(new URL(path, base), {
                method: body ? 'POST' : 'GET',
                redirect: 'error',
                headers: { apikey: key, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined,
                signal: AbortSignal.timeout(15000),
              });
              if (!res.ok) {
                const fault = await res.json().catch(() => ({}));
                const tag = /^[a-zA-Z0-9_]+$/.test(fault.message ?? '') ? ' (' + fault.message + ')' : '';
                throw new Error(path.split('?')[0] + ' returned HTTP ' + res.status + tag);
              }
              const result = await res.text();
              return result ? JSON.parse(result) : null;

            }
            const email = 'rfq-buyer@example.com';
            const password = require('node:crypto').randomUUID() + 'Ab!1';
            const buyer = await call('/auth/v1/admin/users', config.SERVICE_ROLE_KEY, config.SERVICE_ROLE_KEY, {
              email, password, email_confirm: true,
              user_metadata: { full_name: 'Test Buyer', company_name: 'Test Agency', phone: '+998000000000', agent_type: 'Aviakassa' },
            });
            const session = await call('/auth/v1/token?grant_type=password', config.ANON_KEY, config.ANON_KEY, { email, password });
            assert.equal(session.user.id, buyer.id, 'test user should sign in');
            const rows = await call('/rest/v1/profiles?select=id,company_name&id=eq.' + encodeURIComponent(buyer.id), config.ANON_KEY, session.access_token);
            assert.deepEqual(rows.map(row => row.company_name), ['Test Agency']);
            console.log('Local Auth login and authenticated profile query passed.');
            const uuid = /^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i;
            assert.ok(uuid.test(buyer.id), 'invalid fixture user');
            const supplierId = require('node:crypto').randomUUID();
            const { spawnSync } = require('node:child_process');
            const seeded = spawnSync('docker', ['exec', '-i', 'supabase_db_maa-rfq', 'psql', '-X', '-U', 'postgres', '-d', 'postgres', '-q', '-v', 'ON_ERROR_STOP=1'], {
              input: [
                "update public.profiles set is_active=true, registration_status='active', region='Toshkent shahri', city='Toshkent shahri' where id='" + buyer.id + "';",
                "insert into public.external_suppliers(id,supplier_type,name,region,city,status) values ('" + supplierId + "','hotel','Disposable QA Hotel','Samarqand viloyati','Samarqand shahri','registry');",
              ].join('\n'),
              stdio: ['pipe', 'ignore', 'ignore'],
            });
            assert.equal(seeded.status, 0, 'local fixture seed failed');
            const tripDate = new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10);
            const requestId = require('node:crypto').randomUUID();
            await call('/rest/v1/requests', config.ANON_KEY, session.access_token, {
              id: requestId, created_by: buyer.id, category: 'Mehmonxona', origin: 'Toshkent',
              destination: 'Samarqand', travel_date: tripDate, adults: 20, currency: 'UZS',
              description: 'Disposable QA only: 10 twin rooms for 2 nights', status: 'open',
            });
            async function rpc(name, token, body) {
              return call('/rest/v1/rpc/' + name, config.ANON_KEY, token, body);
            }
            const invite = await rpc('create_supplier_invite', session.access_token, {
              p_request_id: requestId, p_supplier_id: supplierId, p_channel: 'manual',
            });
            assert.equal(invite.channel, 'manual');
            if (!/^[0-9a-f]{48}$/.test(invite.token ?? '')) throw new Error('missing valid local invite');
            const visit = await rpc('get_supplier_invite_public', config.ANON_KEY, { p_token: invite.token });
            assert.equal(visit.adults, 20);
            assert.equal(visit.status, 'opened');
            const quoteComment = 'QA only: tax included. Free cancellation until 48h before arrival.';
            const quote = await rpc('submit_supplier_invite_response', config.ANON_KEY, {
              p_token: invite.token, p_available: true, p_price: 4800000, p_currency: 'UZS', p_comment: quoteComment,
            });
            assert.equal(quote.ok, true);
            const list = await rpc('list_request_supplier_invites_p2', session.access_token, { p_request_id: requestId });
            const result = list.find(row => row.id === invite.invite_id);
            assert.ok(result, 'buyer did not see the quote');
            assert.equal(result.status, 'responded');
            assert.equal(Number(result.response.price), 4800000);
            assert.equal(result.response.currency, 'UZS');
            assert.equal(result.response.comment, quoteComment);
            console.log('Local API RFQ round trip passed: request, manual invite, anonymous quote, buyer visibility.');
            const testRequest = require('node:crypto').randomUUID();
            const description = 'QA browser: 10 twin rooms for 2 nights';
            await call('/rest/v1/requests', config.ANON_KEY, session.access_token, {
              id: testRequest, created_by: buyer.id, category: 'Mehmonxona', origin: 'Toshkent',
              destination: 'Samarqand', travel_date: tripDate, adults: 20, currency: 'UZS', description, status: 'open',
            });
            const link = await rpc('create_supplier_invite', session.access_token, {
              p_request_id: testRequest, p_supplier_id: supplierId, p_channel: 'manual',
            });
            if (!/^[0-9a-f]{48}$/.test(link.token ?? '')) throw new Error('missing local browser invite');
            const { chromium } = require(process.env.RUNNER_TEMP + '/maa-browser/node_modules/playwright');
            const { spawn } = require('node:child_process');
            const app = 'http://127.0.0.1:3000';
            const server = spawn(process.execPath, ['node_modules/next/dist/bin/next', 'dev', '--hostname', '127.0.0.1', '--port', '3000'], {
              cwd: process.env.GITHUB_WORKSPACE,
              env: {
                PATH: process.env.PATH, HOME: process.env.HOME, CI: 'true', NEXT_TELEMETRY_DISABLED: '1',
                NEXT_PUBLIC_SUPABASE_URL: base.origin, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: config.ANON_KEY,
                SUPABASE_URL: base.origin, SUPABASE_SERVICE_ROLE_KEY: config.SERVICE_ROLE_KEY, SUPABASE_SECRET_KEY: config.SERVICE_ROLE_KEY,
              },
              stdio: 'ignore',
            });
            let stage = 'local app startup', browser;
            try {
              const deadline = Date.now() + 90000;
              while (!await fetch(app + '/login', {signal: AbortSignal.timeout(5000)}).then(r => r.ok).catch(() => false)) {
                if (server.exitCode !== null || Date.now() > deadline) throw new Error('app not available');
                await new Promise(resolve => setTimeout(resolve, 1500));
              }
              browser = await chromium.launch({headless:true});
              async function page() {
                const context = await browser.newContext({locale:'uz-UZ',serviceWorkers:'block'});
                await context.route('**/*', route => [app,base.origin].includes(new URL(route.request().url()).origin) ? route.continue() : route.abort());
                const p = await context.newPage();
                p.setDefaultTimeout(35000);
                return p;
              }
              stage = 'buyer sign-in and request';
              const bp = await page(), detail = '/requests/' + testRequest;
              await bp.goto(app + '/login?next=' + encodeURIComponent(detail));
              await bp.locator('input[name=identifier]').fill(email);
              await bp.locator('input[name=password]').fill(password);
              const [login] = await Promise.all([
                bp.waitForResponse(r => r.url() === app + '/api/auth/password'),
                bp.locator('button[type=submit]').click(),
              ]);
              if (login.status() !== 200) throw new Error('login HTTP ' + login.status());
              await bp.waitForURL(app + detail);
              await bp.getByText(description,{exact:true}).first().waitFor();
              console.log('Browser buyer login and request passed.');
              stage = 'anonymous supplier submission';
              const sp = await page();
              await sp.goto(app + '/supplier-request/' + link.token);
              await sp.getByRole('button',{name:/^(Mavjud|Есть в наличии)$/}).click();
              await sp.getByLabel(/Jami narx|Итоговая цена/).fill('4800000');
              await sp.getByLabel(/Valyuta|Валюта/).selectOption('UZS');
              const tax = 'QA browser tax included', cancel = 'QA browser free cancellation 48h';
              await sp.getByLabel(/Soliqlar va|Налоги и сборы/).fill(tax);
              await sp.getByLabel(/Bekor qilish|Условия отмены/).fill(cancel);
              await sp.getByRole('button',{name:/Taklifni yuborish|Отправить предложение/}).click();
              await sp.getByText(/Javob qabul qilindi|Ответ принят/).waitFor();
              console.log('Browser supplier quote accepted without account.');
              stage = 'buyer quote rendering';
              await bp.reload();
              await bp.getByText(tax,{exact:false}).first().waitFor();
              await bp.getByText(cancel,{exact:false}).first().waitFor();
              await bp.getByText(/4[^\d]*800[^\d]*000\s*UZS/).first().waitFor();
              console.log('Browser buyer sees total, taxes and cancellation terms.');
            } catch (error) {
              const status = /^login HTTP \d+$/.test(error.message) ? ' (' + error.message + ')' : '';
              throw new Error('Browser step ' + stage + (error.name === 'TimeoutError' ? ' timed out' : ' failed') + status);
            } finally {
              await browser?.close();
              server.kill('SIGTERM');
            }
          }
          test().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Clean up disposable services
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/maa-rfq" ]; then
            cd "$RUNNER_TEMP/maa-rfq"
            npx --yes supabase@2.90.0 stop --no-backup >/dev/null 2>&1 || true
          fi
