name: P0 Dependency Security Update

# P10 runs this only on a working branch; production release remains batched.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/p0-dependency-update.yml

permissions:
  contents: write

jobs:
  update-secure-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Upgrade patched Next.js dependency set
        run: |
          npm pkg delete devDependencies.next
          npm install --save-prod --save-exact next@16.4.1
          npm install --save-dev --save-exact eslint-config-next@16.4.1
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit verified dependency lockfile update to current branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to 16.4.1 security patch"
          git push origin "HEAD:${TARGET_BRANCH}"
