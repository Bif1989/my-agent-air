name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# P0 gate: production dependency audit, tests, lint, build and browser smoke must all pass.
jobs:
  test-build-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Install isolated SQL test dependency
        run: npm install --prefix /tmp/sql-tests --no-package-lock @electric-sql/pglite@0.3.14
      - name: Supplier SQL integration
        env:
          NODE_PATH: /tmp/sql-tests/node_modules
        run: |
          node tests/integration/supplier-location-price.cjs
          node tests/integration/supplier-email-suppression.cjs
          node tests/integration/supplier-delivery-recovery-p1.cjs
      - run: npm run lint
      - name: Build with Turnstile enabled for navigation smoke
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      - name: Install browser smoke dependencies
        run: |
          npm install --prefix /tmp/browser-smoke --no-package-lock playwright@1.56.1
          /tmp/browser-smoke/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Start production build
        run: |
          npm run start > /tmp/my-agent-air.log 2>&1 &
          echo $! > /tmp/my-agent-air.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/my-agent-air.log
          exit 1
      - name: Desktop, Android and iOS browser smoke
        env:
          BASE_URL: http://127.0.0.1:3000
          NODE_PATH: /tmp/browser-smoke/node_modules
        run: node .github/scripts/browser-smoke.cjs
      - name: Dashboard focus browser smoke
        env:
          BASE_URL: http://127.0.0.1:3000
          NODE_PATH: /tmp/browser-smoke/node_modules
        run: node .github/scripts/dashboard-focus-smoke.cjs
      - name: Print app log on failure
        if: failure()
        run: cat /tmp/my-agent-air.log || true
